# default.conf
server {
    listen 80;
    server_name _;

    # React’s static build
    root /usr/share/nginx/html;
    index index.html;

    # Catch‑all so deep‑links like /projects, /about, /contact
    # fall back to index.html (handled by React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve compressed assets correctly
    gzip_static on;
}
